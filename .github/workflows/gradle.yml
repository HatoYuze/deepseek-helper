name: CI Build with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          # 未配置 Secret 时为空字符串，线上集成测试（DeepSeekApiTest）会自动跳过
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        # 排除浏览器端测试（karma/headless chrome 在 CI 上不稳定）；
        # 其他跨平台原生测试会被 Gradle 在不支持的宿主机上自动跳过；
        # apiCheck 校验公共 API 与 api/ 基线一致（binary-compatibility-validator）
        run: ./gradlew build apiCheck -x jsBrowserTest

      - name: Upload JVM artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-helper-jvm
          path: build/libs/*.jar
          if-no-files-found: error
